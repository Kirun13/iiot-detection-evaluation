name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match tag to package version
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - name: Publish versioned GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          iiot-detection-evaluation-*.tgz
          results/report.json results/report.md
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes "Verified evaluation toolkit. The included demo observations and latency values are synthetic. This release does not implement or validate a complete IDS."
