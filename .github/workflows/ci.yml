name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run automated tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=results/tests.xml
      - run: npm run demo
      - name: Package built tool
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ matrix.os }}
          path: |
            results/
            *.tgz
          if-no-files-found: error

